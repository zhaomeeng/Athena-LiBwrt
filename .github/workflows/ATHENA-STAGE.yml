name: Athena A build stage
on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
      preceding:
        type: string
        default: ''
      preview:
        type: boolean
        required: true
env:
  ATHENA_STAGE: ${{ inputs.stage }}
  ATHENA_PREVIEW: ${{ inputs.preview }}
jobs:
  stage:
    name: LiBwrt / ${{ inputs.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout framework
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reclaim runner disk
        run: bash scripts/athena-runner-space.sh
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -yqq install build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-dev rsync unzip zlib1g-dev file wget curl subversion swig libelf-dev libgmp-dev libmpfr-dev libmpc-dev libfuse-dev pkgconf cmake ninja-build zstd ccache quilt patch time ca-certificates jq bzip2 perl tar
          sudo apt-get clean
          sudo mkdir -p /mnt/build_wrt
          sudo chown "$USER:$USER" /mnt/build_wrt
          sudo ln -s "$GITHUB_WORKSPACE/wrt_core" /mnt/wrt_core
          ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/action_build"
          df -h / /mnt >> artifacts/runner-space.txt
      - name: Select preceding or resumable checkpoint
        id: checkpoint
        if: ${{ inputs.preceding != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRECEDING: ${{ inputs.preceding }}
        run: |
          stage="$PRECEDING"
          name="athena-a-checkpoint-$ATHENA_STAGE-$GITHUB_RUN_ID"
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts")
          if jq -e --arg name "$name" '.artifacts[]|select(.name==$name and .expired==false)' <<< "$metadata" >/dev/null; then
            stage="$ATHENA_STAGE"
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
      - name: Download checkpoint
        if: ${{ inputs.preceding != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: athena-a-checkpoint-${{ steps.checkpoint.outputs.stage }}-${{ github.run_id }}
          path: checkpoint-download/
      - name: Restore and validate checkpoint
        if: ${{ inputs.preceding != '' }}
        env:
          CHECKPOINT: ${{ steps.checkpoint.outputs.stage }}
        run: |
          cd /mnt/build_wrt
          bash "$GITHUB_WORKSPACE/scripts/athena-checkpoint.sh" restore "$CHECKPOINT"
      - name: Prepare pinned native source and actual defconfig
        if: ${{ inputs.stage == 'prepare' }}
        run: timeout --signal=TERM --kill-after=30s 100m bash scripts/athena-source.sh
      - name: Download selected package sources
        if: ${{ inputs.stage == 'prepare' && !inputs.preview }}
        run: |
          cd /mnt/build_wrt
          timeout --signal=TERM --kill-after=30s 45m make download -j"$(nproc)"
      - name: Compile stage with four-hour deadline
        id: compile
        if: ${{ inputs.stage != 'prepare' && !inputs.preview }}
        run: |
          cd /mnt/build_wrt
          bash "$GITHUB_WORKSPACE/scripts/athena-compile.sh"
      - name: Preserve completed or time-limited stage
        id: save
        if: ${{ !cancelled() && ((inputs.stage != 'images' && success()) || steps.compile.outcome == 'failure') }}
        run: |
          cd /mnt/build_wrt
          bash "$GITHUB_WORKSPACE/scripts/athena-checkpoint.sh" save "$ATHENA_STAGE"
      - name: Upload checkpoint
        if: ${{ !cancelled() && steps.save.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: athena-a-checkpoint-${{ inputs.stage }}-${{ github.run_id }}
          path: checkpoint-upload/
          retention-days: 3
          compression-level: 0
          overwrite: true
          if-no-files-found: error
      - name: Verify and package Athena images
        if: ${{ inputs.stage == 'images' && !inputs.preview && success() }}
        run: |
          cd /mnt/build_wrt
          bash "$GITHUB_WORKSPACE/scripts/athena-package.sh"
      - name: Upload firmware
        if: ${{ inputs.stage == 'images' && !inputs.preview && success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: athena-a-firmware-${{ github.run_id }}
          path: action_build/upload/
          if-no-files-found: error
          retention-days: 14
      - name: Publish firmware release
        if: ${{ inputs.stage == 'images' && !inputs.preview && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "athena-a-$GITHUB_RUN_ID" action_build/upload/* --title "雅典娜 A 版 LiBwrt $GITHUB_RUN_ID" --notes-file action_build/upload/RELEASE.md
      - name: Preserve configuration and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: athena-a-evidence-${{ inputs.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
